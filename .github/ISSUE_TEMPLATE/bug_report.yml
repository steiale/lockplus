name: Bug Report
description: Report a bug or unexpected behaviour in LockPlus
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Please don't post it here; use [private vulnerability reporting](https://github.com/steiale/lockplus/security/advisories/new).
        Never paste private keys, passwords or a full profile file.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug clearly and concisely.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import a WireGuard profile
        2. Connect with the kill switch on
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: LockPlus version
      description: Settings › About
      placeholder: "2.0.0 (200022)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version
      description:  › About This Mac
      placeholder: "26.6.2 or 27.2"
    validations:
      required: true
  - type: dropdown
    id: protocol
    attributes:
      label: Protocol
      options:
        - WireGuard
        - OpenVPN
        - Both / not protocol-specific
    validations:
      required: true
  - type: dropdown
    id: killswitch
    attributes:
      label: Kill switch
      options:
        - "On"
        - "Off"
        - Not relevant
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: |
        Logs › Save, or Settings › Advanced › Export Diagnostics… (secrets are removed). Paste the relevant part or attach the file.
      render: shell
